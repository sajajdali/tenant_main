          }
        };

        function normalizeLocale(value) {
          var raw = String(value || "").toLowerCase().replace("_", "-");
          var base = raw.split("-")[0];
          return copy[base] ? base : "fa";
        }

        function getShellLocale() {
          var meta = window.__BOOKING_BOOTSTRAP__ && window.__BOOKING_BOOTSTRAP__.meta;
          var stored = "";

          try {
            stored = window.localStorage.getItem("barberbook.locale") || "";
          } catch (error) {
            stored = "";
          }

          return normalizeLocale((meta && meta.locale) || stored || document.documentElement.lang);
        }

        function setMeta(selector, value) {
          var element = document.querySelector(selector);
          if (element) {
            element.setAttribute("content", value);
          }
        }

        window.__BOOKING_APPLY_SHELL_LOCALE__ = function () {
          var locale = getShellLocale();
          var selected = copy[locale] || copy.fa;
          document.documentElement.lang = selected.htmlLang;
          document.documentElement.dir = selected.dir;
          setMeta('meta[property="og:title"]', selected.title);
          setMeta('meta[property="og:description"]', selected.description);
          setMeta('meta[name="twitter:description"]', selected.description);

          var loaderTitle = document.getElementById("boot-loader-title");
          var loaderText = document.getElementById("boot-loader-text");

          if (loaderTitle) {
            loaderTitle.textContent = selected.loaderTitle;
          }

          if (loaderText) {
            loaderText.textContent = selected.loaderText;
          }
        };

        window.__BOOKING_APPLY_SHELL_LOCALE__();
        document.addEventListener("DOMContentLoaded", window.__BOOKING_APPLY_SHELL_LOCALE__);
      })();
    </script>

        function hslToHex(hsl) {
          var parts = hsl.split(" ");
          var h = Number(parts[0]);
          var s = Number(parts[1]) / 100;
          var l = Number(parts[2]) / 100;
          var c = (1 - Math.abs(2 * l - 1)) * s;
          var x = c * (1 - Math.abs((h / 60) % 2 - 1));
          var m = l - c / 2;
          var r = 0;
          var g = 0;
          var b = 0;

          if (h < 60) { r = c; g = x; }
          else if (h < 120) { r = x; g = c; }
          else if (h < 180) { g = c; b = x; }
          else if (h < 240) { g = x; b = c; }
          else if (h < 300) { r = x; b = c; }
          else { r = c; b = x; }

          function toHex(value) {
            return Math.round((value + m) * 255).toString(16).padStart(2, "0");
          }

          return "#" + toHex(r) + toHex(g) + toHex(b);
        }

              delete document.body.dataset.bookingTemplate;
            } else {
              document.body.dataset.bookingTemplate = value;
            }
          }

          if (document.body) {
            applyToBody();
          } else {
            document.addEventListener("DOMContentLoaded", applyToBody, { once: true });
          }
        }

          var settings = JSON.parse(raw);
          bootLogoUrl = settings && (settings.logoUrl || settings.faviconUrl) ? (settings.logoUrl || settings.faviconUrl) : "";
