[program:barber-book-octane]
process_name=%(program_name)s
directory=/Applications/sajjad/for jobs/ui/Barber-Book 2/laravel-app
command=/opt/homebrew/bin/php artisan octane:start --server=roadrunner --host=127.0.0.1 --port=8000 --max-requests=500
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/barber-book-octane.log
stopwaitsecs=3600
