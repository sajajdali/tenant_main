[program:barber-book-reverb]
process_name=%(program_name)s
directory=/Applications/sajjad/for jobs/ui/Barber-Book 2/laravel-app
command=/opt/homebrew/bin/php artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/barber-book-reverb.log
stopwaitsecs=3600
